name: Build and Deploy Documentation

# Only doc-affecting changes trigger a rebuild. This matters: a CI deploy
# replaces whatever is on gh-pages, including a locally-built version that has
# example figures in it (CI cannot execute the examples -- no case data, no GPU).
# Narrowing the trigger keeps unrelated pushes from wiping those figures.
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'doc/**'
      - 'examples/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'doc/**'
      - 'examples/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install -r doc/requirements.txt

    - name: Build documentation
      # GALLERY_TIER=none: render the gallery without executing anything. The
      # examples need downloaded case data, a GPU, and in one case a paid API
      # key, so they can only be executed locally via `make gallery`.
      run: |
        cd doc
        make html

    - name: Deploy to gh-pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./doc/_build/html
        force_orphan: true
