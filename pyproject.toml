[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "integrate_module"
version = "0.99.9"
description = "Localized probabilistic data integration"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = "==3.13.*"
authors = [{ name = "Thomas Mejer Hansen", email = "tmeha@geo.au.dk" }]
license = {text = "MIT"}
keywords = ["inversion","electromagnetic", "geophysics", "geology", "prior", "tarantola"]
classifiers = [
    'Programming Language :: Python :: 3',
]
dependencies = [
    "numpy",
    "matplotlib",
    "h5py",
    "scipy",
    "psutil",
    "tqdm",
    "requests",
    "geoprior1d>=0.9",
    "shapely",
    "ga-aem-forward-win; platform_system == 'Windows'",
    "simpeg>=0.25",
    "jupyter>=1.0.0",
    "jupytext",
    "ipykernel",
    "pandas",
    "pyvista",
    "litellm",
    "libaarhusxyz",
    "jax",
    "uvicorn[standard]",
    "python-fasthtml",
    "openpyxl",
    "httpx",
    "threadpoolctl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
]
ml = [
    "tensorflow",
    "scikit-learn",
    "keras_tuner",
]
examples = [
    "geopandas",
    "shapely",
]
docs = [
    "sphinx",
    "sphinx-gallery",
    "pandoc",
    "myst-parser",
    "sphinx-rtd-theme",
    "furo",
    "ghp-import",
    "tomli; python_version < '3.11'",
]
jax-cuda = [
    "jax[cuda13]",
]
#anemone = [
#    "torch",
#    # local path until anemone is published
#    "anemone @ file:///home/tmeha/PROGRAMMING/anemone",
#]
#simpeg = [
#    # local checkout until pinned to a release (needs simpeg >= 0.22)
#    "simpeg @ file:///home/tmeha/PROGRAMMING/simpeg",
#]


[project.urls]
Homepage = "https://github.com/AUProbGeo/integrate_module"
Documentation = "https://auprobgeo.github.io/integrate_module/"
Repository = "https://github.com/AUProbGeo/integrate_module"
Issues = "https://github.com/AUProbGeo/integrate_module/issues"

[project.scripts]
integrate = "frontend.app:main"
integrate_timing = "integrate.integrate_timing_cli:main"
integrate_rejection = "integrate.integrate_rejection_cli:main"
hdf5_info = "integrate.integrate_hdf5_info_cli:main"

[tool.setuptools]
packages = [
    "integrate",
    "frontend", "frontend.pages", "frontend.services",
]

[tool.setuptools.package-data]
# Ship the FastHTML frontend's static assets (CSS, JS, fonts).
frontend = ["static/**/*"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[tool.ruff]
builtins = ["get_ipython"]   # IPython injects this at runtime

[tool.ruff.lint]
ignore = [
    "E722",  # allow bare `except:` (used in the autoreload blocks)
    "S110",  # allow try-except-pass (same blocks)
]
